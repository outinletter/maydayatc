name: Prepare content for editorial review
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-content-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test publisher
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Collect verified videos and compose fictional practice
        run: python3 scripts/collect-content.py
      - name: Validate before publication
        run: python3 scripts/validate-content.py
      - name: Validate translated lesson guidance
        run: python3 scripts/validate-localization.py
      - name: Save candidate for developer review
        uses: actions/upload-artifact@v4
        with:
          name: content-review-${{ github.run_id }}
          path: |
            content/catalog.json
            ios/MaydayATC/catalog.json
          retention-days: 30
          if-no-files-found: error
